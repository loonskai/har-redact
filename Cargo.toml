[package]
name = "har-redact"
version = "0.1.0"
edition = "2021"
authors = ["HAR Redaction Tool"]
description = "A tool to sanitize/redact sensitive information from HAR files"
repository = "https://github.com/loonskai/har-redact"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9"
